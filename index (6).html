<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koreys tili 1A · Uy vazifasi · @with_IrodaKorean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#f5f6fa;--card:#fff;--ink:#1f2333;--muted:#6b7183;--line:#e2e5ee;
  --c1:#2f6fd6;--c2:#6a4fbf;--c3:#178a7a;--accent:var(--c1);
  --ok:#1f9d55;--okbg:#e6f6ec;--bad:#d64545;--badbg:#fdecec;--soft:#e9effb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Noto Sans KR",system-ui,sans-serif;line-height:1.5}
.ko{font-family:"Noto Sans KR","Nunito",sans-serif}
header{background:var(--accent);color:#fff;padding:22px 16px 26px}
header .in,main,footer{max-width:760px;margin:0 auto}
header h1{margin:0;font-size:1.55rem;font-weight:800}
header p{margin:4px 0 0;opacity:.9;font-size:.95rem}
.back{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;margin-bottom:10px}
main{padding:18px 16px 10px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,30,60,.05)}
.card h3{margin:0 0 2px;font-size:1.12rem}
.card h2{margin:0 0 4px}
.instr{color:var(--muted);font-style:italic;font-size:.86rem;margin-bottom:12px}
.rule{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-bottom:12px}
label.nm{font-weight:800;display:block;margin-bottom:8px}
input[type=text],textarea{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent)}
.unit{display:block;width:100%;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit;border-left:8px solid var(--uc);position:relative}
.unit .tag{color:var(--uc);font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.unit h2{margin:2px 0 4px;font-size:1.3rem}
.unit .topics{color:var(--muted);font-size:.92rem}
.bar{height:7px;background:var(--line);border-radius:9px;margin:14px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--uc);border-radius:9px;transition:width .3s}
.small{font-size:.82rem;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.tabs button{padding:9px 4px;border-radius:999px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button .dot{color:var(--ok)}
.tabs button.on .dot{color:#fff}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.flip{border:2px solid var(--line);border-radius:14px;background:#fff;min-height:86px;cursor:pointer;font:inherit;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink)}
.flip .w{font-size:1.2rem;font-weight:700}
.flip .r{font-size:.78rem;color:var(--muted)}
.flip .t{font-size:.92rem;font-weight:700;color:var(--accent)}
.flip.open{background:var(--soft);border-color:var(--accent)}
.say{border:0;background:none;cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:8px}
.say:hover{background:var(--soft)}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.qn{color:var(--accent);font-weight:800;margin-right:6px}
.gl{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:11px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.row{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.row input{flex:1 1 100px;min-width:0}
.btn{border:0;background:var(--accent);color:#fff;border-radius:11px;padding:9px 16px;font:inherit;font-weight:800;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--line)}
.fb{font-size:.88rem;margin-top:6px;font-weight:700}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)} .fb.hint{color:var(--muted);font-weight:600}
input.right{border-color:var(--ok);background:var(--okbg)} input.wrong{border-color:var(--bad);background:var(--badbg)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.match .col{display:flex;flex-direction:column;gap:9px}
.mi{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font:inherit;font-weight:700;font-size:1.02rem;cursor:pointer;color:var(--ink)}
.mi.sel{border-color:var(--accent);background:var(--soft)}
.mi.done{border-color:var(--ok);background:var(--okbg);color:var(--ok);cursor:default}
.mi.shake{animation:sh .35s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.text p{font-size:1.08rem;line-height:1.9;margin:0 0 12px}
.gw{border:0;background:none;font:inherit;color:inherit;padding:0;border-bottom:2px dotted var(--accent);cursor:pointer;position:relative}
.tip{display:inline-block;background:var(--ink);color:#fff;font-family:"Nunito",sans-serif;font-size:.8rem;border-radius:7px;padding:1px 7px;margin-left:4px;vertical-align:middle;line-height:1.5}
.build{min-height:50px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font:inherit;font-size:1.02rem;cursor:pointer;color:var(--ink)}
.chip.used{visibility:hidden}
.build .chip{background:var(--soft);border-color:var(--accent)}
.clicktext{font-size:1.12rem;line-height:2.4}
.cw{border:0;background:none;font:inherit;padding:2px 1px;margin:0;border-radius:6px;cursor:pointer;color:inherit}
.cw.sel{background:#fff2c2}
.cw.right{background:var(--okbg);color:var(--ok);font-weight:700}
.cw.wrong{background:var(--badbg);color:var(--bad);text-decoration:line-through}
.cw.missed{outline:2px solid var(--bad)}
.model{background:#fbfaf4;border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:1.02rem;line-height:1.85}
.model b{color:var(--accent);display:block;font-family:"Nunito",sans-serif}
textarea{min-height:200px;resize:vertical;line-height:1.7}
.checks{list-style:none;padding:0;margin:10px 0}
.checks li{font-size:.92rem;margin:3px 0;color:var(--muted)}
.checks li.ok{color:var(--ok);font-weight:700}
.next{display:block;margin:4px auto 16px}
.syl{border-collapse:separate;border-spacing:5px;margin:0 auto}.syl th{color:var(--accent);font-size:1.05rem;padding:4px}.sylb{border:2px solid var(--line);background:#fff;border-radius:10px;width:56px;height:58px;font:inherit;font-size:1.25rem;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);padding:0}.sylb .r{font-family:Nunito,sans-serif;font-size:.72rem;color:var(--accent);min-height:1em}.sylb.open{background:var(--soft);border-color:var(--accent)}@media(max-width:520px){.sylb{width:46px;height:52px;font-size:1.1rem}.syl{border-spacing:3px}}.sect{margin:22px 4px 10px;font-size:1.15rem}footer .author{font-weight:800;color:var(--ink);font-size:.92rem}.tg{color:var(--accent);font-weight:800;text-decoration:none}.hauthor{font-weight:700}.hauthor .tg{color:#fff;text-decoration:underline}footer{text-align:center;font-size:.82rem;color:var(--muted);padding:10px 16px 30px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.copybox{margin-top:10px;display:none}
.donebadge{display:inline-block;background:var(--okbg);color:var(--ok);font-weight:800;font-size:.75rem;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:middle}
@media(max-width:520px){.row .btn{padding:9px 11px;font-size:.88rem}.tabs button{font-size:.78rem}header h1{font-size:1.3rem}.bank{grid-template-columns:repeat(2,1fr)}.text p{font-size:1.02rem}}
</style>
</head>

<script>
/* ============ SOZLAMALAR ============ */
const LEVEL = "1A";
const BOOK = "«한국어 첫걸음 1A» darsligi asosida";
const SUB = "한국어 첫걸음 1A · Hangul + 8 dars · Lug'at, o'qish, grammatika va yozuv";
const AUTHOR = "Tuzuvchi: Iroda Normatova";
const TG = "with_IrodaKorean";
const TEACHER = ""; // O'qituvchi ismini shu yerga yozing

/* ============ TOPSHIRIQ YASOVCHILAR ============ */
const B=(words)=>({type:"bank",title:"So'zlar banki",instr:"So'zni bosing – tarjimasi va o'qilishi chiqadi.",
  words:words.split(";").map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf("=");const r=x.slice(i+1).split("|");return[x.slice(0,i).trim(),r[0].trim(),r[1]?r[1].trim():null];})});
const M=(title,rounds)=>({type:"match",title,instr:"Chap va o'ng tomondagi mos so'zlarni juftlang.",
  rounds:rounds.map(r=>r.split(";").map(p=>{const i=p.indexOf("=");return[p.slice(0,i).trim(),p.slice(i+1).trim()];}))});
const C=(title,instr,rule,items)=>({type:"mc",title,instr,rule,items:items.map(([q,gl,o])=>({q,gl,o:o.split("|")}))});
const F=(title,instr,rule,items)=>({type:"fill",title,instr,rule,items:items.map(([q,a,gl])=>({q,gl,a:a.split("/")}))});
const T=(items)=>({type:"tf",title:"To'g'ri yoki noto'g'ri?",instr:"Matn bo'yicha belgilang.",items:items.map(([q,a])=>({q,a:!!a}))});
const O=(items)=>({type:"order",title:"Gap tuzing",instr:"So'zlarni bosib, to'g'ri tartibda gap tuzing.",items:items.map(([gl,w,alt])=>({gl,w:w.split("|"),alt:alt?alt.split(";"):[]}))});
const X=(title,paras)=>({type:"text",title,instr:"Matnni o'qing. Tagiga chizilgan so'zlarni bosing – tarjimasi chiqadi.",paras});
const W=(items)=>F("Matndan so'zni toping","Matnlardan mos so'zni topib yozing.","",items.map(([uz,ko])=>[uz,ko]));

/* ===== 한국어 첫걸음 1A — Hangul + 1–8 dars ===== */
const U = [];

/* 0 · Hangul */
U.push({label:"Hangul", tag:"한글 배우기 · Alifbo", ko:"한글", uz:"Hangul alifbosi", topics:"Unlilar · Undoshlar · Nafasli va qattiq undoshlar · Qo'shma unlilar · 받침 · Bog'lanish (연음)",
vocab:[
 B("아이=bola; 오이=bodring; 우유=sut; 여우=tulki; 나무=daraxt; 바다=dengiz; 모자=shapka; 가수=qo'shiqchi; 지도=xarita; 커피=qahva; 토마토=pomidor; 포도=uzum; 기차=poyezd; 아빠=dada; 오빠=aka (qiz uchun); 사과=olma; 의자=stul; 시계=soat; 가방=sumka; 사람=odam; 책=kitob; 물=suv; 밥=ovqat, guruch; 꽃=gul"),
 M("Harf va tovush",["ㄱ=g / k;ㄴ=n;ㄷ=d / t;ㄹ=r / l;ㅁ=m;ㅂ=b / p","ㅅ=s;ㅇ=jim / ng;ㅈ=j;ㅊ=ch;ㅋ=k (nafasli);ㅎ=h","ㅏ=a;ㅓ=o (ochiq);ㅗ=o;ㅜ=u;ㅡ=i (ы);ㅣ=i","ㅑ=ya;ㅕ=yo (ochiq);ㅛ=yo;ㅠ=yu;ㅐ=e;ㅘ=va"]),
 C("Qaysi harf?","Tovushga mos harfni tanlang.","Oddiy → nafasli → qattiq: <b class='ko'>ㄱ ㅋ ㄲ · ㄷ ㅌ ㄸ · ㅂ ㅍ ㅃ · ㅅ ㅆ · ㅈ ㅊ ㅉ</b>",[
  ["Nafasli «k»","","ㅋ|ㄱ|ㄲ"],["Qattiq «tt»","","ㄸ|ㄷ|ㅌ"],["Nafasli «p»","","ㅍ|ㅂ|ㅃ"],["Qattiq «ss»","","ㅆ|ㅅ|ㅈ"],["Nafasli «ch»","","ㅊ|ㅈ|ㅉ"],["Qo'shma unli «wo»","","ㅝ|ㅘ|ㅚ"]])
],
reading:[
 C("So'zni o'qing","Koreyscha so'zning to'g'ri o'qilishini tanlang.","",[
  ["나무","","namu|nabu|mamu"],["바다","","bada|pada|bara"],["커피","","kopi|gopi|kobi"],["기차","","gicha|gija|kicha"],["사과","","sagwa|sago|sagua"],["의자","","uija|ija|eja"],["사람","","saram|salam|sarap"],["꽃","","kkot|kot|got"]]),
 M("Peshlavhalarni o'qing (간판)",["은행=bank;약국=dorixona;병원=shifoxona;화장실=hojatxona;빵집=nonvoyxona;시장=bozor"]),
 C("받침 tovushi","So'z oxiridagi tovush qanday eshitiladi?","받침da faqat 7 tovush eshitiladi: <b class='ko'>ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅇ</b>. Masalan: 부엌 [부억], 옷 [옫], 앞 [압], 꽃 [꼳].",[
  ["옷 → [ ? ]","","옫|옷|오"],["앞 → [ ? ]","","압|앞|아프"],["부엌 → [ ? ]","","부억|부어크|부엇"],["낮 → [ ? ]","","낟|나즈|낫"]]),
 C("Bog'lanish (연음)","Qanday o'qiladi?","받침dan keyin unli kelsa, 받침 keyingi bo'g'inga o'tadi: <b class='ko'>음악 → [으막]</b>.",[
  ["음악","","[으막]|[음악]|[음마]"],["한국어","","[한구거]|[한국어]|[한구어]"],["사람이에요","","[사라미에요]|[사람이에요]|[사라이에요]"],["옷이","","[오시]|[옫이]|[오디]"]])
],
grammar:[
 F("Bo'g'in tuzing","Harflarni birlashtirib bo'g'in yozing.","Undosh + unli = bo'g'in: <b class='ko'>ㄱ + ㅏ = 가</b>. Unli bilan boshlansa, oldiga <b class='ko'>ㅇ</b> qo'yiladi: <b class='ko'>ㅇ + ㅏ = 아</b>. 받침 pastga yoziladi: <b class='ko'>ㄱ + ㅏ + ㅁ = 감</b>.",[
  ["ㄴ + ㅏ → …","나"],["ㅁ + ㅗ → …","모"],["ㅇ + ㅜ → …","우"],["ㅅ + ㅣ → …","시"],["ㅎ + ㅏ + ㄴ → …","한"],["ㄱ + ㅜ + ㄱ → …","국"],["ㅂ + ㅏ + ㅂ → …","밥"],["ㅁ + ㅜ + ㄹ → …","물"]]),
 F("So'zni yozing","O'qilishiga qarab so'zni hangulda yozing.","",[
  ["a-i (bola)","아이"],["u-yu (sut)","우유"],["ba-da (dengiz)","바다"],["mo-ja (shapka)","모자"],["ga-bang (sumka)","가방"],["sa-ram (odam)","사람"]]),
 C("Qaysi so'z?","O'zbekcha ma'nosiga mos so'zni tanlang.","",[
  ["uzum","","포도|토마토|우유"],["poyezd","","기차|커피|기자"],["soat","","시계|시장|의자"],["daraxt","","나무|나라|바다"],["gul","","꽃|꼬리|책"],["kitob","","책|채|첵"]])
],
writing:[
 C("Yakuniy test","To'g'ri javobni tanlang.","",[
  ["Hangulni kim yaratgan?","","Sejong qirol|Kim Jong|Pak Chong"],["Hangulda nechta asosiy harf bor?","","24 ta|33 ta|10 ta"],["Bo'g'in boshida ㅇ qanday o'qiladi?","","o'qilmaydi|ng|o"],["Qaysi biri qattiq undosh?","","ㄲ|ㅋ|ㄱ"],["밥 so'zidagi 받침 qaysi?","","ㅂ|ㅏ|ㅁ"]]),
 F("Ismingizni yozing","Quyidagi o'zbek ismlarini hangulda yozing.","Masalan: Aziz → <b class='ko'>아지즈</b>, Malika → <b class='ko'>말리카</b>.",[
  ["Aziz","아지즈"],["Malika","말리카"],["Dilnoza","딜노자"],["Sardor","사르도르"],["Toshkent","타슈켄트"]])
]
});

/* 1 */
U.push({label:"1-dars", tag:"1-dars · 제1과", ko:"안녕하세요?", uz:"Salom! Tanishaylik", topics:"Davlatlar · Kasblar · Salomlashish · N은/는 N이에요/예요 · N입니다 · N이/가 아니에요",
vocab:[
 B("한국=Koreya; 우즈베키스탄=O'zbekiston; 미국=AQSh; 일본=Yaponiya; 중국=Xitoy; 러시아=Rossiya; 영국=Angliya; 프랑스=Fransiya; 독일=Germaniya; 카자흐스탄=Qozog'iston; 튀르키예=Turkiya; 베트남=Vyetnam; 학생=talaba, o'quvchi; 선생님=o'qituvchi; 회사원=kompaniya xodimi; 의사=shifokor; 요리사=oshpaz; 기자=jurnalist; 경찰=politsiyachi; 간호사=hamshira; 운전기사=haydovchi; 가수=qo'shiqchi; 주부=uy bekasi; 은행원=bank xodimi; 사람=odam"),
 M("Davlat va kasb",["한국=Koreya;미국=AQSh;일본=Yaponiya;중국=Xitoy;러시아=Rossiya;독일=Germaniya","학생=talaba;회사원=kompaniya xodimi;의사=shifokor;요리사=oshpaz;기자=jurnalist;가수=qo'shiqchi"]),
 C("Salomlashish","Vaziyatga mos iborani tanlang.","Ketayotganga — <b class='ko'>안녕히 가세요</b>, qolayotganga — <b class='ko'>안녕히 계세요</b>.",[
  ["Birinchi tanishuv: «Tanishganimdan xursandman»","","만나서 반가워요.|안녕히 가세요.|감사합니다."],["Mehmon ketyapti. Mezbon aytadi:","","안녕히 가세요.|안녕히 계세요.|만나서 반가워요."],["Mehmon ketyapti. Mehmon aytadi:","","안녕히 계세요.|안녕히 가세요.|안녕하세요?"],["Sovg'a oldingiz:","","감사합니다.|안녕히 계세요.|반가워요."],["Rasmiy salom:","","안녕하십니까?|안녕?|고마워요."]])
],
reading:[

/* Romanizatsiya (soddalashtirilgan) */
const RI=["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"];
const RM=["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"];
const RF=["","k","k","k","n","n","n","t","l","k","m","l","l","l","p","l","m","p","p","t","t","ng","t","t","k","t","p","t"];
const RL=["","g","kk","ks","n","nj","nh","d","r","lg","lm","lb","ls","lt","lp","lh","m","b","bs","s","ss","ng","j","ch","k","t","p",""];
function roman(str){let out="",ch=[...str];for(let i=0;i<ch.length;i++){const c=ch[i].charCodeAt(0);if(c<0xAC00||c>0xD7A3){out+=ch[i];continue;}
  const n=c-0xAC00,ini=Math.floor(n/588),med=Math.floor((n%588)/28),fin=n%28;let syl=(i===0||!isKo(ch[i-1])?(ini===5?"r":RI[ini]):RI[ini])+RM[med];
  const nx=ch[i+1]?ch[i+1].charCodeAt(0):0;const nextVowelStart=nx>=0xAC00&&nx<=0xD7A3&&Math.floor((nx-0xAC00)/588)===11;
  syl+= fin? (nextVowelStart&&fin!==21?RL[fin]:RF[fin]) :"";out+=syl;}return out;}

function tabDone(u,t){const l=taskList(u).filter(k=>k.startsWith(`${u.id}-${t}-`));return l.length&&l.every(k=>S.done[k]);}

function card(t,instr,rule){const c=el("div",{class:"card"},el("h3",{class:isKo(t)?"ko":""},t));if(instr)c.append(el("div",{class:"instr"},instr));if(rule)c.append(el("div",{class:"rule",html:rule}));return c;}

function rBank(x){const c=card(x.title,x.instr);const g=el("div",{class:"bank"});
  x.words.forEach(([w,t,rm])=>{const b=el("div",{class:"flip",role:"button",tabindex:"0"});
    const draw=()=>{b.innerHTML="";b.append(el("span",{class:"w ko"},w));if(b.classList.contains("open"))b.append(el("span",{class:"r"},rm||roman(w)),el("span",{class:"t"},t));};
    b.onclick=()=>{b.classList.toggle("open");draw();};b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();b.click();}};draw();g.append(b);});
  c.append(g);return c;}

function rMatch(x,key){const c=card(x.title,x.instr);let r=0,errors=0,total=0;const box=el("div");c.append(box);
  x.rounds.forEach(rd=>total+=rd.length);
  const draw=()=>{box.innerHTML="";if(r>=x.rounds.length){box.append(el("div",{class:"fb ok"},`🎉 Barakalla! Xatolar: ${errors}`),el("button",{class:"btn ghost",style:"margin-top:8px",onclick:()=>{r=0;errors=0;draw();}},"Qaytadan"));return;}
    const rd=x.rounds[r];box.append(el("div",{class:"small",style:"margin-bottom:6px"},`${r+1}-bosqich / ${x.rounds.length}`));
    let sel=null,left=rd.length;const L=el("div",{class:"col"}),R=el("div",{class:"col"});
    const L2=shuffle(rd.map((p,i)=>({t:p[0],i}))),R2=shuffle(rd.map((p,i)=>({t:p[1],i})));
    const mk=(o,side)=>{const b=el("button",{class:"mi"+(isKo(o.t)?" ko":"")},o.t);b.onclick=()=>{if(b.classList.contains("done"))return;
      if(isKo(o.t))speak(o.t);
      if(!sel||sel.side===side){if(sel)sel.b.classList.remove("sel");sel={b,o,side};b.classList.add("sel");return;}
      if(sel.o.i===o.i){sel.b.classList.remove("sel");sel.b.classList.add("done");b.classList.add("done");sel=null;if(--left===0){r++;setTimeout(()=>{if(r>=x.rounds.length)markDone(key,Math.max(0,total-errors),total);draw();},450);}}
      else{errors++;[b,sel.b].forEach(z=>{z.classList.remove("sel");z.classList.add("shake");setTimeout(()=>z.classList.remove("shake"),400);});sel=null;}};return b;};
    L2.forEach(o=>L.append(mk(o,"L")));R2.forEach(o=>R.append(mk(o,"R")));box.append(el("div",{class:"match"},L,R));};
  draw();return c;}

    draw();q.append(build,pool,el("div",{class:"row"},el("button",{class:"btn",onclick:check},"Tekshirish"),el("button",{class:"btn ghost",onclick:()=>{if(!ok){picked=[];fb.textContent="";draw();}}},"Tozalash")),fb);c.append(q);});return c;}

function rText(x){const c=card(x.title,x.instr);const d=el("div",{class:"text ko"});
  x.paras.forEach(p=>{const P=el("p");p.split(/(\[[^\]]+\])/).forEach(seg=>{const m=seg.match(/^\[([^|]+)\|([^\]]+)\]$/);if(m){const b=el("button",{class:"gw"},m[1]);let tip=null;b.onclick=()=>{if(tip){tip.remove();tip=null;}else{tip=el("span",{class:"tip"},m[2]);b.after(tip);speak(m[1]);}};P.append(b);}else P.append(seg);});
    d.append(P);});c.append(d);return c;}

function rTable(x){const c=card(x.title,x.instr);const t=el("table",{class:"syl ko"});const hr=el("tr",{},el("th",{},""));x.cols.forEach(v=>hr.append(el("th",{},v)));t.append(hr);
  x.rows.forEach(([cons,ini])=>{const tr=el("tr",{},el("th",{},cons));x.cols.forEach((v,j)=>{const ch=String.fromCharCode(0xAC00+(x.ci[cons])*588+x.vi[j]*28);let rd=(ini+x.vr[j]);if(ch==="시")rd="shi";const td=el("td",{},el("button",{class:"sylb",onclick:e=>{const b=e.currentTarget;b.classList.toggle("open");b.querySelector(".r").textContent=b.classList.contains("open")?rd:"";}},el("span",{},ch),el("span",{class:"r"},"")));tr.append(td);});t.append(tr);});
  c.append(el("div",{style:"overflow-x:auto"},t));return c;}
function sendCard(u){const c=card("📋 Natijani o'qituvchiga yuborish","Tugma ismingiz va ballaringizni nusxalaydi – keyin uni o'qituvchingizga xabar qilib yuboring.");const box=el("textarea",{class:"copybox",readonly:"readonly",style:"min-height:140px"});
  c.append(el("button",{class:"btn",onclick:async()=>{const rep=report(u);box.value=rep;try{await navigator.clipboard.writeText(rep);toast("📋 Nusxalandi! Endi o'qituvchiga yuboring.");box.style.display="none";}catch(e){box.style.display="block";box.focus();box.select();toast("Matnni belgilab, nusxa oling.");}}},"📋 Nusxa olib, o'qituvchiga yuborish"),box);return c;}

/* ============ YOZUV ============ */
function countSent(v){return v.split(/[.!?\n]+/).map(z=>z.trim()).filter(z=>isKo(z)).length;}
function rWriting(u){const w=u.writing,wrap=el("div");wrap.append(el("h2",{style:"margin:0 0 12px"},w.title));
  const s=w.click,c1=card("1-qadam · Xatolarni toping","Xato yozilgan so'zlarni bosing, keyin «Tekshirish»ni bosing.",s.rule);const txt=el("div",{class:"clicktext ko"});const toks=[];
  s.text.split(/(\*[^*]+\*|\s+)/).forEach(seg=>{if(!seg)return;if(/^\s+$/.test(seg)){txt.append(" ");return;}
    const m=seg.match(/^\*([^|*]+)(?:\|([^*]+))?\*$/);let word,target=false,fix=null;if(m){word=m[1];target=true;fix=m[2]||null;}else word=seg;
    const mm=word.match(/^(.*?)([.?!,']*)$/s);const core=mm[1],punct=mm[2];if(!core){txt.append(punct);return;}
    const lead=core.match(/^(['"]*)(.*)$/s);if(lead[1])txt.append(lead[1]);
    const b=el("button",{class:"cw"},lead[2]);const tk={b,target,fix,core:lead[2]};b.onclick=()=>{if(c1._checked)return;b.classList.toggle("sel");};toks.push(tk);txt.append(b);if(punct)txt.append(punct);});
  const fb1=el("div",{class:"fb"});const key1=u.id+"-writing-1";
  const chk=el("button",{class:"btn",style:"margin-top:10px",onclick:()=>{if(c1._checked){c1._checked=false;toks.forEach(t=>{t.b.className="cw";t.b.textContent=t.core;});chk.textContent="Tekshirish";fb1.textContent="";return;}
    c1._checked=true;let hit=0,wrong=0,n=0;toks.forEach(t=>{const sel=t.b.classList.contains("sel");if(t.target){n++;t.b.textContent=t.fix?`${t.core} → ${t.fix}`:t.core;if(sel){hit++;t.b.className="cw right";}else t.b.className="cw missed";}else if(sel){wrong++;t.b.className="cw wrong";}else t.b.className="cw";});
    if(hit===n&&!wrong){fb1.className="fb ok";fb1.textContent=`✓ Hammasi to'g'ri! (${hit}/${n})`;markDone(key1,hit,n);}else{fb1.className="fb no";fb1.textContent=`Topildi: ${hit}/${n}. Ortiqcha belgilangan: ${wrong}. Qaytadan urinib ko'ring.`;}
    chk.textContent="Qaytadan";}},"Tekshirish");
  c1.append(txt,chk,fb1);wrap.append(c1);
  const c2=card("2-qadam · Namunani o'qing","Namuna matnni diqqat bilan o'qing.");c2.append(el("div",{class:"model ko"},el("b",{},w.model.title),w.model.text));wrap.append(c2);
  const key3=u.id+"-writing-3";const c3=card("3-qadam · Navbat sizda ✍️",w.task);c3.append(el("div",{class:"rule"},w.include));
  const ta=el("textarea",{class:"ko",placeholder:"Shu yerga koreys tilida yozing…","aria-label":"Matn",lang:"ko"});ta.value=S.text[u.id]||"";
  const cnt=el("div",{class:"small"});const ul=el("ul",{class:"checks"});
  const upd=()=>{const v=ta.value;S.text[u.id]=v;save();const sents=countSent(v);
    cnt.textContent=`${sents} ta gap (maqsad: ${w.min}–${w.max})`;ul.innerHTML="";let all=true;
    w.checks.forEach(([test,label])=>{const ok=test==="sent"?sents>=w.min:test.test(v);if(!ok)all=false;ul.append(el("li",{class:ok?"ok":""},(ok?"✓ ":"○ ")+label));});
    if(all&&!S.done[key3])markDone(key3);};
  ta.oninput=upd;
  const box=el("textarea",{class:"copybox",readonly:"readonly",style:"min-height:140px"});
  const send=el("button",{class:"btn",onclick:async()=>{const rep=report(u);box.value=rep;try{await navigator.clipboard.writeText(rep);toast("📋 Nusxalandi! Endi o'qituvchiga yuboring.");box.style.display="none";}catch(e){box.style.display="block";box.focus();box.select();toast("Matnni belgilab, nusxa oling.");}}},"📋 Nusxa olib, o'qituvchiga yuborish");
  c3.append(ta,cnt,ul,send,box,el("div",{class:"small",style:"margin-top:8px"},"Matningiz shu qurilmada saqlanadi. Tugma matningiz va ballaringizni nusxalaydi – keyin uni o'qituvchingizga xabar qilib yuboring."));
  wrap.append(c3);setTimeout(upd);return wrap;}

function report(u){const [d,t]=unitProgress(u);const lines=[`Koreys tili uy vazifasi (한국어 첫걸음 ${LEVEL})`,`Ism: ${S.name||"(yozilmagan)"}`,`${u.label||(u.num+"-dars")}: ${u.ko} (${u.uz})`,`Bajarildi: ${d} / ${t}`,""];
  for(const[tab,lab]of TABS){if(tab==="writing"&&!Array.isArray(u.writing))continue;u[tab].forEach((x,i)=>{const k=`${u.id}-${tab}-${i}`;if(x.type==="text"||x.type==="bank")return;const sc=S.score[k];lines.push(`${lab} · ${x.title}: ${S.done[k]?(sc?`${sc[0]}/${sc[1]} (birinchi urinishda)`:"✓"):"bajarilmagan"}`);});}
  if(Array.isArray(u.writing))return lines.join("\n");
  lines.push(`Yozuv · Xatolarni topish: ${S.done[u.id+"-writing-1"]?"✓":"bajarilmagan"}`);lines.push("","— Matnim —",(S.text[u.id]||"").trim()||"(bo'sh)");return lines.join("\n");}

/* ============ SAHIFALAR ============ */
let cur=null;
function refreshTabs(){if(!cur)return;document.querySelectorAll(".tabs button").forEach(b=>{b.querySelector(".dot").textContent=tabDone(cur,b.dataset.t)?" ✓":"";});const h=$("#prog");if(h){const[d,t]=unitProgress(cur);h.textContent=`${d} / ${t} topshiriq bajarildi`;}}
function tgLink(){return el("a",{href:"https://t.me/"+TG,target:"_blank",rel:"noopener",class:"tg"},"@"+TG);}
function footer(){return el("footer",{},el("div",{class:"author"},AUTHOR),el("div",{},tgLink()),el("div",{class:"small",style:"margin-top:4px"},BOOK));}

function home(){cur=null;document.documentElement.style.setProperty("--accent","#2f6fd6");const app=$("#app");app.innerHTML="";
  let D=0,Tt=0;UNITS.forEach(u=>{const[d,t]=unitProgress(u);D+=d;Tt+=t;});
  app.append(el("header",{},el("div",{class:"in"},el("h1",{},"Koreys tili · Uy vazifasi ",el("span",{class:"ko"},"숙제")),el("p",{},SUB),el("p",{class:"hauthor"},AUTHOR+" · ",tgLink()))));
  const m=el("main");const nc=el("div",{class:"card"},el("label",{class:"nm",for:"nm"},"Ismingiz / 이름"));const ni=el("input",{type:"text",id:"nm",placeholder:"Ismingizni yozing"});ni.value=S.name;ni.oninput=()=>{S.name=ni.value;save();};
  nc.append(ni,el("div",{class:"bar",style:"--uc:var(--ok)"},el("i",{style:`width:${Tt?D/Tt*100:0}%`})),el("div",{class:"small"},`Umumiy natija: ${D} / ${Tt} topshiriq`));m.append(nc);
  UNITS.forEach(u=>{if(u.section)m.append(el("h2",{class:"sect"},u.section));const[d,t]=unitProgress(u);const b=el("button",{class:"card unit",style:`--uc:${u.color}`,onclick:()=>{location.hash=u.id+"-vocab";}},
    el("div",{class:"tag"},u.tag||`${u.num}-dars · 제${u.num}과`),el("h2",{},el("span",{class:"ko"},u.ko)," ",el("span",{style:"font-weight:600;color:var(--muted);font-size:1rem"},u.uz),d===t?el("span",{class:"donebadge"},"✓ Tugallandi"):null),el("div",{class:"topics"},u.topics),el("div",{class:"bar"},el("i",{style:`width:${t?d/t*100:0}%`})),el("div",{class:"small"},`${d} / ${t} topshiriq bajarildi`));m.append(b);});
  app.append(m,footer());window.scrollTo(0,0);}

function unitPage(u,tab){cur=u;document.documentElement.style.setProperty("--accent",u.color);const app=$("#app");app.innerHTML="";
  const[d,t]=unitProgress(u);
  const nav=el("div",{style:"display:flex;gap:6px;flex-wrap:wrap"},el("button",{class:"back",onclick:()=>{location.hash="home";}},"← Barcha darslar"));
  if(u.num>1)nav.append(el("button",{class:"back",onclick:()=>{location.hash=`u${u.num-1}-vocab`;}},`‹ ${UNITS[u.num-2].label||(u.num-1)+"-dars"}`));
  if(u.num<UNITS.length)nav.append(el("button",{class:"back",onclick:()=>{location.hash=`u${u.num+1}-vocab`;}},`${UNITS[u.num].label||(u.num+1)+"-dars"} ›`));
  app.append(el("header",{},el("div",{class:"in"},nav,el("h1",{},`${u.label||(u.num+"-dars")} · `,el("span",{class:"ko"},u.ko)," ",el("span",{style:"font-weight:600;opacity:.85;font-size:.8em"},u.uz)),el("p",{id:"prog"},`${d} / ${t} topshiriq bajarildi`))));
  const m=el("main");const tb=el("div",{class:"tabs"});
  TABS.forEach(([k,l])=>tb.append(el("button",{class:k===tab?"on":"","data-t":k,onclick:()=>{location.hash=`${u.id}-${k}`;}},l,el("span",{class:"dot"},""))));m.append(tb);
  if(tab==="writing"&&!Array.isArray(u.writing))m.append(rWriting(u));
  else{u[tab].forEach((x,i)=>{const key=`${u.id}-${tab}-${i}`;const f={bank:rBank,match:rMatch,mc:rMC,tf:rTF,fill:rFill,order:rOrder,text:rText,table:rTable}[x.type];m.append(f(x,key));});
    if(tab==="writing")m.append(sendCard(u));}
  const idx=TABS.findIndex(z=>z[0]===tab);
  if(idx<TABS.length-1)m.append(el("button",{class:"btn next",onclick:()=>{location.hash=`${u.id}-${TABS[idx+1][0]}`;}},`Keyingisi: ${TABS[idx+1][1]} →`));
  else if(u.num<UNITS.length)m.append(el("button",{class:"btn next",onclick:()=>{location.hash=`u${u.num+1}-vocab`;}},`Keyingi dars: ${UNITS[u.num].label||(u.num+1)+"-dars"} →`));
  else m.append(el("button",{class:"btn ghost next",onclick:()=>{location.hash="home";}},"← Barcha darslarga qaytish"));
  app.append(m,footer());refreshTabs();window.scrollTo(0,0);}

function route(){const h=location.hash.replace("#","");const m=h.match(/^u(\d+)-(vocab|reading|grammar|writing)$/);const u=m&&UNITS[+m[1]-1];if(u)unitPage(u,m[2]);else home();}
window.addEventListener("hashchange",route);
route();
